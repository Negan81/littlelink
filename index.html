<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Bar El Paseo - Carta Digital</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- Estilos nativos de LittleLink -->
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/skeleton.css">
  <link rel="stylesheet" href="css/brands.css">
  
  <style>
    body {
      background-color: #0f172a;
      color: #ffffff;
    }
    .container {
      max-width: 400px;
      margin-top: 30px;
      text-align: center;
    }
    .badge-mesa {
      background-color: #2563eb;
      color: #fff;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 20px;
      font-size: 14px;
      letter-spacing: 1px;
    }
    .btn-restaurante {
      display: block;
      width: 100%;
      height: 48px;
      line-height: 48px;
      padding: 0 16px;
      margin-bottom: 12px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 16px;
      border: none;
      color: #ffffff !important;
      cursor: pointer;
      box-sizing: border-box;
      text-decoration: none;
    }
    .btn-camarero { background-color: #dc2626; }
    .btn-camarero:hover { background-color: #b91c1c; }
    .btn-cuenta { background-color: #16a34a; }
    .btn-cuenta:hover { background-color: #15803d; }
    
    .seccion-carta {
      margin-top: 30px;
      text-align: left;
      background: #1e293b;
      padding: 15px;
      border-radius: 12px;
    }
    .plato {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #334155;
    }
    .plato:last-child { border-bottom: none; }
    .precio { color: #38bdf8; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <!-- Identificador de Mesa -->
    <div id="mesa-badge" class="badge-mesa">CARGANDO MESA...</div>

    <h2>Bar El Paseo</h2>
    <p style="color: #94a3b8; font-size: 14px;">Selecciona una opción o consulta los platos</p>

    <!-- Botones Principales de Notificación -->
    <button onclick="enviarAviso('Llamar Camarero')" class="btn-restaurante btn-camarero">
      🔔 Llamar al Camarero
    </button>

    <button onclick="enviarAviso('Pedir la Cuenta')" class="btn-restaurante btn-cuenta">
      💳 Pedir la Cuenta
    </button>

    <!-- Carta Base del Restaurante -->
    <div class="seccion-carta">
      <h3 style="font-size: 18px; margin-bottom: 15px; text-align: center;">📜 Nuestra Carta</h3>
      
      <div class="plato">
        <span>Caña de Cerveza</span>
        <span class="precio">2,50 €</span>
      </div>
      <div class="plato">
        <span>Ración de Patatas Bravas</span>
        <span class="precio">6,50 €</span>
      </div>
      <div class="plato">
        <span>Bocadillo de Calamares</span>
        <span class="precio">5,00 €</span>
      </div>
    </div>
  </div>

  <script>
    // 1. Detectar parámetro ?mesa=X de la URL
    const urlParams = new URLSearchParams(window.location.search);
    const mesa = urlParams.get('mesa') || 'General';
    document.getElementById('mesa-badge').innerText = `MESA ${mesa}`;

    // 2. Función que activa la notificación a ntfy.sh
    function enviarAviso(tipo) {
      fetch('https://ntfy.sh/test-restaurante-1234', {
        method: 'POST',
        headers: {
          'Title': `${tipo.toUpperCase()} - MESA ${mesa}`,
          'Priority': 'high',
          'Tags': tipo.includes('Cuenta') ? 'credit_card' : 'bell'
        },
        body: `La Mesa ${mesa} ha solicitado: ${tipo}`
      })
      .then(res => {
        if(res.ok) {
          alert(`✅ Solicitud enviada: ${tipo}. El personal acudirá enseguida.`);
        } else {
          alert("❌ Error al enviar aviso.");
        }
      })
      .catch(err => {
        alert("❌ Error de red.");
      });
    }
  </script>
</body>
</html>
