<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Bar El Paseo - Carta Digital</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- Estilos de LittleLink -->
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/skeleton.css">
  <link rel="stylesheet" href="css/brands.css">
  
  <style>
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .container {
      max-width: 400px;
      margin-top: 30px;
      text-align: center;
      padding-bottom: 40px;
    }
    .badge-mesa {
      background-color: #2563eb;
      color: #fff;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 20px;
      font-size: 14px;
      letter-spacing: 1px;
    }
    .btn-restaurante {
      display: block;
      width: 100%;
      height: 48px;
      line-height: 48px;
      padding: 0 16px;
      margin-bottom: 12px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 16px;
      border: none;
      color: #ffffff !important;
      cursor: pointer;
      box-sizing: border-box;
      text-decoration: none;
    }
    .btn-camarero { background-color: #dc2626; }
    .btn-camarero:active { background-color: #b91c1c; }
    .btn-cuenta { background-color: #16a34a; }
    .btn-cuenta:active { background-color: #15803d; }
    
    .seccion-carta {
      margin-top: 30px;
      text-align: left;
      background: #1e293b;
      padding: 15px;
      border-radius: 12px;
    }
    .categoria-titulo {
      font-size: 16px;
      color: #38bdf8;
      border-bottom: 1px solid #334155;
      padding-bottom: 4px;
      margin-top: 15px;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .plato {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #334155;
    }
    .plato:last-child { border-bottom: none; }
    .plato-info { flex-grow: 1; padding-right: 10px; }
    .plato-nombre { font-weight: bold; font-size: 15px; display: block; }
    .plato-desc { font-size: 12px; color: #94a3b8; display: block; margin-top: 2px; }
    .precio { color: #38bdf8; font-weight: bold; font-size: 15px; white-space: nowrap; }
    .cargando { text-align: center; color: #94a3b8; font-size: 14px; padding: 20px 0; }
  </style>
</head>
<body>

  <div class="container">
    <!-- Identificador de Mesa -->
    <div id="mesa-badge" class="badge-mesa">CARGANDO MESA...</div>

    <h2>Bar El Paseo</h2>
    <p style="color: #94a3b8; font-size: 14px;">Servicio interactivo de mesa</p>

    <!-- Botones Principales de Notificación -->
    <button onclick="enviarAviso('Llamar Camarero')" class="btn-restaurante btn-camarero">
      🔔 Llamar al Camarero
    </button>

    <button onclick="enviarAviso('Pedir la Cuenta')" class="btn-restaurante btn-cuenta">
      💳 Pedir la Cuenta
    </button>

    <!-- Contenedor Dinámico de la Carta -->
    <div class="seccion-carta">
      <h3 style="font-size: 18px; margin-bottom: 15px; text-align: center; color: #ffffff;">📜 Nuestra Carta</h3>
      <div id="contenedor-platos" class="cargando">Cargando la carta en tiempo real...</div>
    </div>
  </div>

  <script>
    // 1. Detectar parámetro ?mesa=X de la URL
    const urlParams = new URLSearchParams(window.location.search);
    const mesa = urlParams.get('mesa') || 'General';
    document.getElementById('mesa-badge').innerText = `MESA ${mesa}`;

    // 2. Cargar los platos dinámicamente desde el Worker
    async function cargarCarta() {
      const contenedor = document.getElementById('contenedor-platos');
      try {
        const response = await fetch('https://api-carta.joigseru.workers.dev/api/carta');
        const platos = await response.json();

        if (!platos || platos.length === 0) {
          contenedor.innerHTML = '<p class="cargando">No hay productos disponibles actualmente.</p>';
          return;
        }

        // Agrupar platos por categoría
        const categorias = {};
        platos.forEach(p => {
          if (p.disponible !== false) {
            const cat = p.categoria || 'Otros';
            if (!categorias[cat]) categorias[cat] = [];
            categorias[cat].push(p);
          }
        });

        let html = '';
        for (const [cat, lista] of Object.entries(categorias)) {
          html += `<div class="categoria-titulo">${cat}</div>`;
          lista.forEach(p => {
            html += `
              <div class="plato">
                <div class="plato-info">
                  <span class="plato-nombre">${p.nombre}</span>
                  ${p.descripcion ? `<span class="plato-desc">${p.descripcion}</span>` : ''}
                </div>
                <span class="precio">${parseFloat(p.precio).toFixed(2)} €</span>
              </div>
            `;
          });
        }

        contenedor.innerHTML = html;
      } catch (err) {
        contenedor.innerHTML = '<p class="cargando" style="color: #ef4444;">Error al cargar la carta. Inténtalo de nuevo.</p>';
      }
    }

    // 3. Función que envía la alerta a ntfy.sh
    function enviarAviso(tipo) {
      fetch('https://ntfy.sh/test-restaurante-1234', {
        method: 'POST',
        headers: {
          'Title': `${tipo.toUpperCase()} - MESA ${mesa}`,
          'Priority': 'high',
          'Tags': tipo.includes('Cuenta') ? 'credit_card' : 'bell'
        },
        body: `La Mesa ${mesa} ha solicitado: ${tipo}`
      })
      .then(res => {
        if(res.ok) {
          alert(`✅ Solicitud enviada: ${tipo}. El personal acudirá enseguida.`);
        } else {
          alert("❌ Error al enviar aviso.");
        }
      })
      .catch(err => {
        alert("❌ Error de red.");
      });
    }

    // Cargar la carta al abrir la página
    cargarCarta();
  </script>
</body>
</html>
